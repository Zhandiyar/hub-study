spring:
  application:
    name: hub
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  http:
    client:
      factory: http-components
      connect-timeout: ${OUTBOUND_HTTP_CONNECT_TIMEOUT:2s}
      read-timeout: ${OUTBOUND_HTTP_READ_TIMEOUT:3s}
      redirects: dont-follow
  mvc:
    problemdetails:
      enabled: true
server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus

app:
  clients:
    app-registry:
      base-url: ${APP_REGISTRY_BASE_URL}
  problems:
    base-uri: ${APP_PROBLEMS_BASE_URI}

logbook:
  strategy: body-only-if-status-at-least
  minimum-status: 400
  predicate:
    exclude:
      - path: /actuator/**
      - path: /swagger-ui/**
      - path: /v3/api-docs/**
      - path: /favicon.ico
      - path: /hub/api/v1/services/*/contracts/**
      - path: /internal/api/v1/contracts/**
  obfuscate:
    replacement: "***"
    headers:
      - Authorization
      - Cookie
      - Set-Cookie
    parameters:
      - code
      - token
    json-body-fields:
      - credentialId
      - secret
      - token
      - value
      - accessToken
      - refreshToken
  write:
    status-code-based: true
    max-body-size: 10000
    validate-json-body: true

springdoc:
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.study.hub: INFO
    org.zalando.logbook.Logbook: TRACE
