spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
  level:
    root: INFO
    com.study.hub: INFO
    org.zalando.logbook: TRACE
