spring:
  config:
    activate:
      on-profile: prod
  main:
    banner-mode: off

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${APP_VERSION:0.1.0-SNAPSHOT}
        environment: ${APP_ENVIRONMENT:prod}
  level:
    root: INFO
    com.study.hub: INFO
    org.zalando.logbook.Logbook: TRACE
